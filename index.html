<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DB Trainer Pro</title>
<meta name="description" content="5-day dumbbell home workout tracker — Chest+Triceps, Back+Biceps, Legs+Glutes, Shoulders+Traps, Arms+Core">
<meta name="theme-color" content="#08090F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">

<style>
/*──── TOKENS ────*/
:root {
  --bg:#08090F; --surf:#0C0E1A; --card:#111422; --card2:#161A2E;
  --bdr:#1C2138; --bdr2:#252D4A; --fg:#E6EAF8; --fgm:#58628C; --fgd:#222A48;
  --ok:#2ED158; --warn:#FF9F0A; --danger:#FF453A;
  color-scheme: dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F2F4FA; --surf:#FFFFFF; --card:#FFFFFF; --card2:#F7F8FD;
  --bdr:#DDE2F0; --bdr2:#C8CEEA; --fg:#0E1228; --fgm:#7A84AA; --fgd:#CBD1E8;
  color-scheme: light;
}}
:root[data-theme="light"]{
  --bg:#F2F4FA; --surf:#FFFFFF; --card:#FFFFFF; --card2:#F7F8FD;
  --bdr:#DDE2F0; --bdr2:#C8CEEA; --fg:#0E1228; --fgm:#7A84AA; --fgd:#CBD1E8;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#08090F; --surf:#0C0E1A; --card:#111422; --card2:#161A2E;
  --bdr:#1C2138; --bdr2:#252D4A; --fg:#E6EAF8; --fgm:#58628C; --fgd:#222A48;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/*──── TOPBAR ────*/
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:var(--surf);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:12px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  height:52px;
}
.topbar::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);z-index:10;background:var(--surf);
}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--h,#5B9BFF)}
.topbar-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.tclock{font-size:12px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums;color:var(--fgm)}
.streak-pill{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:rgba(255,159,10,.12);color:#FF9F0A;font-size:11px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:16px;transition:background .15s}
.icon-btn:hover{background:var(--card2)}

/*──── TABS ────*/
.ntabs{
  display:flex;background:var(--surf);border-bottom:1px solid var(--bdr);
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.ntabs::-webkit-scrollbar{display:none}
.ntab{
  flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 8px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fgm);border-bottom:2px solid transparent;
  cursor:pointer;transition:color .15s;white-space:nowrap;
  border-top:0;border-left:0;border-right:0;background:none;
}
.ntab.on{color:var(--h,#5B9BFF);border-bottom-color:var(--h,#5B9BFF)}
.ntab-dot{width:5px;height:5px;border-radius:50%;background:var(--h,#5B9BFF);opacity:0;margin-top:3px;transition:opacity .2s}
.ntab.done .ntab-dot{opacity:1}
.ntab-sub{font-size:9px;letter-spacing:.04em;font-weight:600;margin-top:1px;opacity:.7}

/*──── PANELS ────*/
#panels{padding-bottom:max(80px,calc(60px + env(safe-area-inset-bottom,0px)))}
.dpanel{display:none}
.dpanel.on{display:block}

.dhead{
  padding:20px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,var(--g,rgba(91,155,255,.12)),transparent);
}
.dhead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dname{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.dgoal{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--h,#5B9BFF);margin-top:4px}
.dmeta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.vol-chip{padding:4px 10px;border-radius:20px;background:var(--g,rgba(91,155,255,.12));border:1px solid var(--h,#5B9BFF);font-size:11px;font-weight:700;color:var(--h,#5B9BFF)}

/*──── PROGRESS ────*/
.prog-wrap{padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-label{font-size:11px;font-weight:600;color:var(--fgm);letter-spacing:.05em}
.prog-count{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.prog-bar{height:5px;border-radius:3px;background:var(--bdr);overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--h,#5B9BFF);transition:width .3s ease;width:0%}

/*──── MUSCLE CHIPS ────*/
.mchip{padding:5px 12px;border-radius:20px;border:1px solid var(--bdr2);font-size:11px;font-weight:600;color:var(--fgm)}

/*──── INFO BANNER ────*/
.info-bar{
  margin:0 max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  padding:9px 12px;border-radius:8px;border:1px solid var(--bdr);
  background:var(--card);font-size:11px;color:var(--fgm);display:flex;align-items:flex-start;gap:8px;line-height:1.4;
}
.info-bar .ib-icon{font-size:13px;flex-shrink:0;margin-top:1px}

/*──── EXERCISE CARDS ────*/
.exlist{display:flex;flex-direction:column;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.excard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.ex-hd{
  display:flex;align-items:flex-start;gap:10px;padding:14px 14px 0 14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.ex-badge{
  padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;margin-top:2px;
}
.ex-badge.compound{background:rgba(var(--hr,91,155,255),.18);color:var(--h,#5B9BFF)}
.ex-badge.isolation{background:rgba(var(--hr,91,155,255),.10);color:var(--fgm);border:1px solid var(--bdr2)}
.ex-info{flex:1;min-width:0}
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.ex-tip{font-size:11px;color:var(--fgm);margin-top:3px;line-height:1.4}
.ex-expand{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--card2);font-size:12px;flex-shrink:0;
  transition:transform .2s;color:var(--fgm);
}
.excard.open .ex-expand{transform:rotate(180deg)}

.ex-det{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 14px}
.excard.open .ex-det{max-height:400px}
.ex-det-inner{padding:10px 0 12px;border-top:1px solid var(--bdr);margin-top:10px}
.ex-steps{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.ex-step{display:flex;gap:10px;align-items:flex-start}
.ex-step-n{
  width:18px;height:18px;border-radius:50%;background:var(--g,rgba(91,155,255,.12));
  border:1px solid var(--h,#5B9BFF);color:var(--h,#5B9BFF);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.ex-step-txt{font-size:12px;color:var(--fg);line-height:1.5}
.ex-mistake{display:flex;gap:8px;padding:8px 10px;border-radius:7px;background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.2);font-size:11px;color:var(--danger);line-height:1.4;align-items:flex-start}
.ex-mistake-icon{font-size:12px;flex-shrink:0;margin-top:1px}

.ex-sep{height:1px;background:var(--bdr);margin:0 14px}
.ex-tracker{padding:12px 14px}
.w-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.w-btn{
  width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--bdr2);
  font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;
  transition:background .1s,transform .1s;color:var(--fgm);
}
.w-btn:active{transform:scale(.88)}
.w-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.w-unit{font-size:11px;color:var(--fgm);font-weight:600}
.w-hint{flex:1;text-align:right;font-size:10px;color:var(--fgm);font-style:italic}
.w-pr{font-size:10px;font-weight:700;color:#FFD60A;letter-spacing:.03em}

.sets-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sets-label{font-size:11px;font-weight:600;color:var(--fgm);white-space:nowrap}
.sets-chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.set-chip{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--bdr2);
  background:var(--card2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--fgm);cursor:pointer;transition:all .15s;
  font-variant-numeric:tabular-nums;
}
.set-chip.done{background:var(--h,#5B9BFF);border-color:var(--h,#5B9BFF);color:#fff}
.set-chip:active{transform:scale(.88)}

/*──── REST BAR ────*/
.rest-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:var(--surf);border-top:1px solid var(--bdr);
  padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .25s ease;
}
.rest-bar.on{transform:translateY(0)}
.rest-row{display:flex;align-items:center;gap:10px}
.rest-label{font-size:11px;font-weight:600;color:var(--fgm);flex-shrink:0}
.rest-track{flex:1;height:4px;border-radius:2px;background:var(--bdr);overflow:hidden}
.rest-fill{height:100%;border-radius:2px;background:var(--rh,#5B9BFF);transition:width .5s linear}
.rest-time{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--rh,#5B9BFF)}
.rest-btns{display:flex;gap:6px}
.rest-add{padding:5px 10px;border-radius:7px;background:var(--card2);border:1px solid var(--bdr2);font-size:11px;font-weight:600;color:var(--fg)}
.rest-skip{padding:5px 10px;border-radius:7px;background:var(--card2);border:1px solid var(--bdr2);font-size:11px;font-weight:600;color:var(--fgm)}
.rest-exname{font-size:10px;color:var(--fgm);margin-top:4px}

/*──── MODALS ────*/
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;opacity:0;transition:opacity .2s}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal{
  position:relative;background:var(--surf);border-radius:16px 16px 0 0;
  border:1px solid var(--bdr);border-bottom:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .3s ease;
}
.modal-wrap.on .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--bdr2);margin:10px auto 16px}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}

/*──── HISTORY ────*/
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-hdr{font-size:9px;font-weight:700;color:var(--fgm);text-align:center;letter-spacing:.04em}
.cal-day{
  aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;color:var(--fgm);background:var(--card2);border:1px solid var(--bdr);
}
.cal-day.has-data{border-color:var(--dc,#5B9BFF);background:var(--dg,rgba(91,155,255,.2));color:var(--dc,#5B9BFF)}
.cal-day.today{outline:2px solid var(--h,#5B9BFF);outline-offset:1px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px}
.stat-n{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;font-weight:600;color:var(--fgm);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/*──── SETTINGS ────*/
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bdr)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:13px;font-weight:600}
.set-sub{font-size:11px;color:var(--fgm);margin-top:2px}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:3px;gap:3px}
.seg-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--fgm);transition:all .15s}
.seg-btn.on{background:var(--surf);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rst-btn{
  width:100%;margin-top:16px;padding:12px;border-radius:10px;
  background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.3);
  font-size:13px;font-weight:600;color:var(--danger);transition:background .15s;cursor:pointer;
}
.rst-btn:hover{background:rgba(255,69,58,.18)}

/*──── CELEBRATION ────*/
.celeb{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);padding:20px;opacity:0;pointer-events:none;transition:opacity .3s;
}
.celeb.on{opacity:1;pointer-events:auto}
.celeb-card{
  background:var(--surf);border:1px solid var(--h,#5B9BFF);border-radius:16px;
  padding:28px 24px;max-width:300px;width:100%;text-align:center;position:relative;overflow:hidden;
}
.celeb-emoji{font-size:48px;display:block;margin-bottom:12px}
.celeb-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.celeb-sub{font-size:13px;color:var(--fgm);line-height:1.5;margin-bottom:16px}
.celeb-ok{
  width:100%;padding:12px;border-radius:10px;
  background:var(--h,#5B9BFF);color:#fff;font-size:14px;font-weight:700;cursor:pointer;
}
.particle{position:absolute;width:6px;height:6px;border-radius:2px;pointer-events:none}
@keyframes pfloat{0%{transform:translateY(0) scale(1);opacity:.8}100%{transform:translateY(-60px) scale(0);opacity:0}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">DB<span>Pro</span></div>
  <div class="topbar-mid">
    <div class="tclock" id="tclock">00:00</div>
    <div class="streak-pill">🔥 <span id="streak-n">0</span></div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openM('history')" title="History">📊</button>
    <button class="icon-btn" onclick="openM('settings')" title="Settings">⚙️</button>
  </div>
</div>

<!-- TABS -->
<div class="ntabs" id="tabs-bar" role="tablist"></div>

<!-- PANELS -->
<div id="panels"></div>

<!-- REST BAR -->
<div class="rest-bar" id="rest-bar">
  <div class="rest-row">
    <div class="rest-label">REST</div>
    <div class="rest-track"><div class="rest-fill" id="rest-fill" style="width:100%"></div></div>
    <div class="rest-time" id="rest-time">–</div>
    <div class="rest-btns">
      <button class="rest-add" onclick="addRest(30)">+30s</button>
      <button class="rest-skip" onclick="skipRest()">Skip</button>
    </div>
  </div>
  <div class="rest-exname" id="rest-exname"></div>
</div>

<!-- HISTORY MODAL -->
<div class="modal-wrap" id="modal-history">
  <div class="modal-overlay" onclick="closeM('history')"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-title">Training History</div>
    <div id="hist-body"></div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-wrap" id="modal-settings">
  <div class="modal-overlay" onclick="closeM('settings')"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div class="modal-title">Settings</div>
    <div id="sett-body"></div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="celeb" id="celeb">
  <div class="celeb-card" id="celeb-card">
    <span class="celeb-emoji">🏆</span>
    <div class="celeb-title" id="celeb-title">Day Complete!</div>
    <div class="celeb-sub" id="celeb-sub">Great work today.</div>
    <button class="celeb-ok" onclick="closeCeleb()">Keep Going →</button>
  </div>
</div>

<script>
const DAYS=[
  {id:'chest_tri',label:'MON',name:'Chest + Triceps',goal:'Push Strength',hue:'#5B9BFF',glow:'rgba(91,155,255,.13)',hr:'91,155,255',muscles:['Chest','Triceps','Front Delts','Serratus'],warmup:'5 min: arm circles, band pull-aparts, 10 slow push-ups',cooldown:'Chest doorway stretch, overhead tricep stretch, 5 min foam roll',synergy:'Triceps pre-warm from every pressing set — hit them while hot.',exercises:[{name:'DB Flat Press',tag:'compound',sets:4,reps:'10–12',defw:22.5,rest:90,tip:'Lower 3 s, pause, press explosively. Elbows at 60°, not 90°.',steps:['Lie flat, feet on floor. DBs at chest width, elbows ~60° from torso.','Lower slowly until DBs reach chest level, brief pause.','Drive up explosively, exhale — do not lock out at top.'],mistake:'Flaring elbows 90° out loads the shoulder capsule, not the pecs.'},{name:'Incline DB Press',tag:'compound',sets:3,reps:'10–12',defw:17.5,rest:90,tip:'30–45° incline only. Steeper = more shoulder, less upper chest.',steps:['Bench at 30–45°. DBs at collarbone height, arms angled slightly out.','Lower with control until you feel upper chest stretch.','Press in a slight arc so DBs meet over upper chest at top.'],mistake:'Going too steep shifts load from upper chest to front delts.'},{name:'DB Fly',tag:'isolation',sets:3,reps:'12–15',defw:12.5,rest:60,tip:'Think "hugging a barrel." Keep a constant slight bend in elbows.',steps:['DBs above chest, palms facing, slight bend in elbows.','Lower in wide arc — feel deep pec stretch at bottom.','Squeeze pecs hard at top. Do not press — fly, no elbow movement.'],mistake:'Bending elbows progressively turns this into a press — keep angle fixed.'},{name:'Skull Crusher',tag:'isolation',sets:3,reps:'10–12',defw:12.5,rest:60,tip:'Hinge at elbow only. Upper arm stays vertical, perpendicular to floor.',steps:['Lie flat, DBs above forehead, arms straight and vertical.','Hinge at elbows only — lower DBs toward temples.','Extend back up, squeezing triceps hard at top.'],mistake:'Moving the upper arm bends this into a pullover and loses tricep isolation.'},{name:'Tricep Kickback',tag:'isolation',sets:3,reps:'12–15',defw:10,rest:60,tip:'Hinge until torso is parallel. Upper arm stays glued to your side.',steps:['Hinge forward so torso is nearly parallel to floor.','Upper arm pinned to side, extend forearm back until arm is straight.','Hold 2 s at full lockout — that peak contraction is where it works.'],mistake:'Letting the elbow drop mid-rep kills the isolation completely.'}]},
  {id:'back_bi',label:'TUE',name:'Back + Biceps',goal:'Pull Strength',hue:'#AC70F0',glow:'rgba(172,112,240,.13)',hr:'172,112,240',muscles:['Lats','Rhomboids','Biceps','Brachialis','Rear Delts'],warmup:'5 min: cat-cow, band pull-aparts, 10 bodyweight row (table)',cooldown:'Doorway lat stretch, standing bicep wall stretch, 5 min foam roll upper back',synergy:'Biceps assist every row — hit them while already under load.',exercises:[{name:'Bent-Over Row',tag:'compound',sets:4,reps:'10–12',defw:22.5,rest:90,tip:'Hinge to ~45°, brace like a plank. Pull to navel — not the chest.',steps:['Hip hinge, soft knees, flat back. DBs hang below chest, overhand grip.','Drive elbows straight back — lead with elbows, not wrists.','Pause at top squeezing shoulder blades. Lower in 3 s.'],mistake:'Rounding the lower back under load — brace your core hard before each set.'},{name:'Single-Arm Row',tag:'compound',sets:3,reps:'10–12',defw:22.5,rest:90,tip:'Let the elbow lead and drive past your hip. Feel the lat, not the trap.',steps:['Non-working hand on bench, back flat, slight torso rotation allowed.','DB starts hanging directly below shoulder.','Pull to hip, rotating torso slightly — squeeze lat, not shoulder.'],mistake:'Shrugging the shoulder takes load to the traps — keep shoulder down.'},{name:'DB Deadlift',tag:'compound',sets:3,reps:'10–12',defw:25,rest:90,tip:'Push the floor away with your legs. This is leg drive + hip hinge, not a back exercise.',steps:['Feet hip-width, DBs at sides. Hip hinge + bend knees until DBs reach mid-shin.','Brace core, chest up, then drive heels into floor.','Extend hips and knees simultaneously — lock out tall at top.'],mistake:'Letting hips shoot up first turns it into a dangerous back-only lift.'},{name:'Alternating Curl',tag:'isolation',sets:3,reps:'12',defw:10,rest:60,tip:'Supinate (pinky up) as you curl. Full range — full drop every rep.',steps:['Stand tall, DBs at sides, palms forward.','Curl one arm at a time, rotating wrist inward as it rises.','Lower completely before starting the next arm — count it.'],mistake:'Using hip momentum when tired — drop the weight before that starts.'},{name:'Hammer Curl',tag:'isolation',sets:3,reps:'10–12',defw:12.5,rest:60,tip:'Neutral grip targets brachialis and brachioradialis — builds arm thickness.',steps:['Stand, DBs at sides, palms facing each other.','Curl both together, thumbs up throughout, no wrist rotation.','Pause at shoulder height, lower in 3 s — feel the stretch at the bottom.'],mistake:'Letting elbows drift forward reduces bicep peak contraction.'}]},
  {id:'legs_glutes',label:'WED',name:'Legs + Glutes',goal:'Lower Power',hue:'#34C265',glow:'rgba(52,194,101,.13)',hr:'52,194,101',muscles:['Quads','Hamstrings','Glutes','Calves','Core'],warmup:'5 min: hip circles, bodyweight squat × 15, glute bridge × 15',cooldown:'Pigeon stretch, standing quad stretch, seated hamstring stretch, 5 min foam roll',synergy:'Biggest muscle groups = biggest metabolism boost. This is your hardest day.',exercises:[{name:'Goblet Squat',tag:'compound',sets:4,reps:'12–15',defw:22.5,rest:90,tip:'Hold DB vertical at chest. Push knees OUT, sit between heels.',steps:['Feet shoulder-width, toes 15° out. DB held vertically at chest.','Sit back and down between your heels — go below parallel.','Drive through heels and push knees out. Chest stays tall throughout.'],mistake:'Knees caving inward — consciously push them out on every rep.'},{name:'Romanian Deadlift',tag:'compound',sets:4,reps:'10–12',defw:25,rest:90,tip:'Push hips BACK, not down. Feel the hamstring load under tension.',steps:['Stand, DBs in front of thighs, soft knee bend (stay soft throughout).','Hinge at hips driving DBs down shins — back flat, hips back.','When you feel hamstrings fully loaded, squeeze glutes to return.'],mistake:'Bending knees too much converts it into a regular deadlift — keep knees soft but constant.'},{name:'Bulgarian Split Squat',tag:'compound',sets:3,reps:'10 each',defw:12.5,rest:90,tip:'Front foot far enough forward that your shin stays vertical at the bottom.',steps:['Rear foot elevated on bench, front foot ~1 m forward. DBs at sides.','Lower straight down — front knee tracks over toes, stays off midline.','Drive through the heel of your front foot — rear leg supports, not drives.'],mistake:'Leaning too far forward shifts load from glutes to lower back.'},{name:'DB Hip Thrust',tag:'isolation',sets:3,reps:'15',defw:22.5,rest:60,tip:'Squeeze glutes HARD at lockout and hold 2 s. Ribs stay down — no lower back arch.',steps:['Upper back resting on bench edge, DB on   {id:'shoulders_traps',label:'THU',name:'Shoulders + Traps',goal:'Overhead Strength',hue:'#FF9F0A',glow:'rgba(255,159,10,.13)',hr:'255,159,10',muscles:['Anterior Delt','Medial Delt','Posterior Delt','Traps','Rotator Cuff'],warmup:'5 min: neck rolls, band pull-aparts × 20, face pull × 15, empty-hand press × 15',cooldown:'Cross-body shoulder stretch, chest opener against doorway, trap neck stretch',synergy:'Chest has recovered for 3 days. Delts now get full, fresh attention.',exercises:[{name:'Seated DB Press',tag:'compound',sets:4,reps:'10–12',defw:17.5,rest:90,tip:'Start at ear level, press straight overhead. Ribs stay down — do not arch.',steps:['Sit upright, back supported. DBs at ear level, elbows at ~90°.','Press straight overhead in a vertical path, neutral or pronated grip.','Lower to ear level with control. Stop just short of lockout each rep.'],mistake:'Pressing the DBs forward instead of straight up — path should be vertical.'},{name:'Arnold Press',tag:'compound',sets:3,reps:'10–12',defw:12.5,rest:90,tip:'Start palms-facing-you; rotate to palms-forward as you press. Reverse on the way down.',steps:['Hold DBs at chin height, palms facing your face.','As you press up, rotate palms outward — fully pronated at the top.','Reverse the rotation as you lower back to start.'],mistake:'Going too heavy kills the rotation — this is a technique-first movement.'},{name:'Lateral Raise',tag:'isolation',sets:3,reps:'12–15',defw:8,rest:60,tip:'Slight forward lean, lead with elbows. Pinky slightly higher than thumb at the top.',steps:['Stand with slight forward lean (~10°), DBs at sides.','Raise arms out to sides, leading with elbows not wrists.','Lower in 3–4 s — the eccentric builds the medial delt.'],mistake:'Using momentum and shrugging — lighter weight, strict control always wins here.'},{name:'Rear Delt Fly',tag:'isolation',sets:3,reps:'12–15',defw:7.5,rest:60,tip:'Most people skip this. It balances the shoulders and prevents the rounded look.',steps:['Hinge forward until torso is nearly parallel to floor, DBs hanging.','Raise elbows out to sides in a reverse fly arc — feel the rear delt.','Squeeze shoulder blades at top, lower slowly.'],mistake:'Shrugging traps to help — keep shoulders depressed throughout.'},{name:'DB Shrug',tag:'isolation',sets:3,reps:'15–20',defw:22.5,rest:45,tip:'Go straight up, not rolling. Rolling the shoulder can stress the AC joint.',steps:['Stand tall, heavy DBs at sides.','Shrug shoulders straight up toward ears — no rolling.','Hold 1–2 s at top, lower in 2 s. Full drop every rep.'],mistake:'Rolling shoulders forward then up — this adds AC joint stress with no benefit.'}]},

zing, hold 1 s at lockout.'],mistake:'Upper arms moving — once they move, you are no longer isolating triceps.'},{name:'Russian Twist',tag:'isolation',sets:3,reps:'20',defw:7.5,rest:45,tip:'Rotate from the torso — not just the arms. Elevate feet for extra core demand.',steps:['Sit at 45°, feet lightly elevated, DB held at chest with both hands.','Rotate torso to one side, touch DB near the floor beside your hip.','Control the rotation back and through to the other side.'],mistake:'Swinging arms without rotating the torso — the trunk twist is the exercise.'}]}
];

const KEY='dbpro1';
let ST,restMax,restLeft,restInterval,clockInterval,activeDay;

function loadST(){try{ST=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){ST=null};if(!ST)ST={sess:{},prefs:{units:'kg',restC:90,restI:60}};if(!ST.sess)ST.sess={};if(!ST.prefs)ST.prefs={units:'kg',restC:90,restI:60}}
function saveST(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function todayK(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getToday(){const k=todayK();if(!ST.sess[k])ST.sess[k]={sets:{},weights:{},startedAt:null};return ST.sess[k]}
function parseReps(r){return parseInt(r)||10}
function countDone(dayId){const s=getToday().sets;let n=0;DAYS.find(x=>x.id===dayId).exercises.forEach((ex,i)=>{(s[dayId+'_'+i]||[]).forEach(v=>{if(v)n++})});return n}
function totalSets(dayId){return DAYS.find(x=>x.id===dayId).exercises.reduce((a,ex)=>a+ex.sets,0)}
function isDayDone(dayId){return countDone(dayId)>=totalSets(dayId)}
function calcVol(dayId){const sess=getToday();let v=0;DAYS.find(x=>x.id===dayId).exercises.forEach((ex,i)=>{const chips=sess.sets[dayId+'_'+i]||[];const w=sess.weights[dayId+'_'+i]??ex.defw;v+=chips.filter(Boolean).length*w*parseReps(ex.reps)});return v}
function fmtVol(v){return v>=1000?(v/1000).toFixed(1)+'k':String(Math.round(v))}
function getUnit(){return ST.prefs.units==='lbs'?'lbs':'kg'}
function toDisplay(w){return ST.prefs.units==='lbs'?Math.round(w*2.20462*2)/2:w}
function getPrevW(dayId,exIdx){const key=dayId+'_'+exIdx;const today=todayK();for(const k of Object.keys(ST.sess).filter(k=>k<today).sort().reverse()){if(ST.sess[k].weights&&ST.sess[k].weights[key]!==undefined)return ST.sess[k].weights[key]}return null}
function getMaxW(dayId,exIdx){const key=dayId+'_'+exIdx;let mx=0;Object.keys(ST.sess).filter(k=>k<todayK()).forEach(k=>{if(ST.sess[k].weights&&ST.sess[k].weights[key]!==undefined)mx=Math.max(mx,ST.sess[k].weights[key])});return mx}
function getStreak(){let streak=0,d=new Date();for(let i=0;i<30;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const found=ST.sess[k]&&Object.values(ST.sess[k].sets||{}).some(a=>a.some(Boolean));if(found)streak++;else if(i>0)break;d.setDate(d.getDate()-1)}return streak}

function renderAll(){renderTabs();renderPanels();document.getElementById('streak-n').textContent=getStreak();const d=new Date().getDay();const map={1:0,2:1,3:2,4:3,5:4};activeDay=DAYS[map[d]??0].id;switchDay(activeDay)}

function renderTabs(){const bar=document.getElementById('tabs-bar');bar.innerHTML='';DAYS.forEach(d=>{const btn=document.createElement('button');btn.className='ntab';btn.setAttribute('role','tab');btn.setAttribute('data-id',d.id);btn.style.setProperty('--h',d.hue);btn.innerHTML=`<span>${d.label}</span><span class="ntab-sub">${d.name.split(' ').slice(0,2).join(' ')}</span><div class="ntab-dot"></div>`;btn.onclick=()=>switchDay(d.id);if(isDayDone(d.id))btn.classList.add('done');bar.appendChild(btn)})}

function renderPanels(){const container=document.getElementById('panels');container.innerHTML='';DAYS.forEach(d=>{const sess=getToday();const panel=document.createElement('div');panel.className='dpanel';panel.id='panel-'+d.id;panel.style.setProperty('--h',d.hue);panel.style.setProperty('--g',d.glow);panel.style.setProperty('--hr',d.hr);panel.innerHTML=`
<div class="dhead">
  <div class="dhead-top">
    <div><div class="dname">${d.name}</div><div class="dgoal">${d.goal}</div></div>
    <div class="vol-chip" id="vol-${d.id}">${fmtVol(calcVol(d.id))} ${getUnit()}</div>
  </div>
  <div class="dmeta">${d.muscles.map(m=>`<span class="mchip">${m}</span>`).join('')}</div>
</div>
<div class="prog-wrap">
  <div class="prog-row"><span class="prog-label">SETS DONE</span><span class="prog-count" id="prog-count-${d.id}">${countDone(d.id)} / ${totalSets(d.id)}</span></div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill-${d.id}" style="width:${(countDone(d.id)/totalSets(d.id)*100).toFixed(1)}%"></div></div>
</div>
<div class="info-bar"><span class="ib-icon">🔥</span><span><strong>Trainer note:</strong> ${d.synergy}</span></div>
<div class="info-bar"><span class="ib-icon">🤸</span><span><strong>Warm-up:</strong> ${d.warmup}</span></div>
<div class="exlist" id="exlist-${d.id}">${d.exercises.map((ex,i)=>renderExCard(d,ex,i,sess)).join('')}</div>
<div class="info-bar" style="margin-top:14px"><span class="ib-icon">❄️</span><span><strong>Cool-down:</strong> ${d.cooldown}</span></div>`;
  container.appendChild(panel)})}

function renderExCard(d,ex,i,sess){const key=d.id+'_'+i;const chips=sess.sets[key]||(sess.sets[key]=Array(ex.sets).fill(false));const w=sess.weights[key]??ex.defw;const prevW=getPrevW(d.id,i);const maxW=getMaxW(d.id,i);const isPR=w>maxW&&maxW>0;const hint=prevW!==null?`Last: ${toDisplay(prevW)} ${getUnit()}`:'First session';const done=chips.every(Boolean);return `<div class="excard${done?' done':''}" id="excard-${d.id}-${i}">
  <div class="ex-hd" onclick="toggleExpand('${d.id}',${i})">
    <span class="ex-badge ${ex.tag}">${ex.tag}</span>
    <div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-tip">${ex.tip}</div></div>
    <button class="ex-expand" aria-label="Expand">▾</button>
  </div>
  <div class="ex-det" id="exdet-${d.id}-${i}">
    <div class="ex-det-inner">
      <div class="ex-steps">${ex.steps.map((s,n)=>`<div class="ex-step"><div class="ex-step-n">${n+1}</div><div class="ex-step-txt">${s}</div></div>`).join('')}</div>
      <div class="ex-mistake"><span class="ex-mistake-icon">⚠️</span>${ex.mistake}</div>
    </div>
  </div>
  <div class="ex-sep"></div>
  <div class="ex-tracker">
    <div class="w-row">
      <button class="w-btn" onclick="chgW('${d.id}',${i},-2.5)">−</button>
      <span class="w-val" id="wval-${d.id}-${i}">${toDisplay(w)}</span>
      <span class="w-unit">${getUnit()}</span>
      <button class="w-btn" onclick="chgW('${d.id}',${i},2.5)">+</button>
      <span class="w-hint" id="whint-${d.id}-${i}">${isPR?'<span class="w-pr">🏆 PR!</span>':hint}</span>
    </div>
    <div class="sets-row">
      <span class="sets-label">${ex.sets} sets × ${ex.reps} reps</span>
      <div class="sets-chips" id="chips-${d.id}-${i}">${chips.map((_,si)=>`<button class="set-chip${chips[si]?' done':''}" id="chip-${d.id}-${i}-${si}" onclick="toggleSet('${d.id}',${i},${si})">${si+1}</button>`).join('')}</div>
    </div>
  </div>
</div>`}

function switchDay(id){activeDay=id;document.querySelectorAll('.dpanel').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('on'));const panel=document.getElementById('panel-'+id);if(panel)panel.classList.add('on');const tab=document.querySelector(`.ntab[data-id="${id}"]`);if(tab){tab.classList.add('on');tab.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}}
function toggleExpand(dayId,i){document.getElementById('excard-'+dayId+'-'+i).classList.toggle('open')}

function toggleSet(dayId,exIdx,si){const sess=getToday();const key=dayId+'_'+exIdx;const d=DAYS.find(x=>x.id===dayId);const ex=d.exercises[exIdx];if(!sess.sets[key])sess.sets[key]=Array(ex.sets).fill(false);sess.sets[key][si]=!sess.sets[key][si];if(!sess.startedAt&&sess.sets[key][si]){sess.startedAt=Date.now();startClock(sess.startedAt)}saveST();refreshChip(dayId,exIdx,si);refreshCard(dayId,exIdx);refreshProgress(dayId);refreshTab(dayId);checkPR(dayId,exIdx);if(sess.sets[key][si]){startRest(ex.tag==='compound'?ST.prefs.restC:ST.prefs.restI,ex.name,si+1,dayId)}else{skipRest()}if(isDayDone(dayId))setTimeout(()=>showCeleb(dayId),400)}

function refreshChip(dayId,exIdx,si){const chips=(getToday().sets[dayId+'_'+exIdx]||[]);const chip=document.getElementById('chip-'+dayId+'-'+exIdx+'-'+si);if(chip){if(chips[si])chip.classList.add('done');else chip.classList.remove('done')}}
function refreshCard(dayId,exIdx){const chips=(getToday().sets[dayId+'_'+exIdx]||[]);const card=document.getElementById('excard-'+dayId+'-'+exIdx);if(!card)return;if(chips.length&&chips.every(Boolean))card.classList.add('done');else card.classList.remove('done')}
function refreshProgress(dayId){const done=countDone(dayId),total=totalSets(dayId);const fill=document.getElementById('prog-fill-'+dayId);const count=document.getElementById('prog-count-'+dayId);const vol=document.getElementById('vol-'+dayId);if(fill)fill.style.width=(total>0?(done/total*100):0).toFixed(1)+'%';if(count)count.textContent=done+' / '+total;if(vol)vol.textContent=fmtVol(calcVol(dayId))+' '+getUnit()}
function refreshTab(dayId){const tab=document.querySelector(`.ntab[data-id="${dayId}"]`);if(!tab)return;if(isDayDone(dayId))tab.classList.add('done');else tab.classList.remove('done')}
function checkPR(dayId,exIdx){const sess=getToday();const key=dayId+'_'+exIdx;const d=DAYS.find(x=>x.id===dayId);const w=sess.weights[key]??d.exercises[exIdx].defw;const maxW=getMaxW(dayId,exIdx);const prevW=getPrevW(dayId,exIdx);const hint=document.getElementById('whint-'+dayId+'-'+exIdx);if(hint){if(w>maxW&&maxW>0)hint.innerHTML='<span class="w-pr">🏆 PR!</span>';else hint.textContent=prevW!==null?'Last: '+toDisplay(prevW)+' '+getUnit():'First session'}}
function chgW(dayId,exIdx,delta){const sess=getToday();const key=dayId+'_'+exIdx;const ex=DAYS.find(x=>x.id===dayId).exercises[exIdx];const nw=Math.max(0,(sess.weights[key]??ex.defw)+delta);sess.weights[key]=nw;saveST();const el=document.getElementById('wval-'+dayId+'-'+exIdx);if(el)el.textContent=toDisplay(nw);checkPR(dayId,exIdx);refreshProgress(dayId)}

function startRest(sec,exName,setNum,dayId){skipRest();const d=DAYS.find(x=>x.id===dayId);restMax=sec;restLeft=sec;const bar=document.getElementById('rest-bar');bar.style.setProperty('--rh',d?d.hue:'#5B9BFF');bar.classList.add('on');document.getElementById('rest-time').textContent=fmtSec(restLeft);document.getElementById('rest-fill').style.width='100%';document.getElementById('rest-exname').textContent=`After set ${setNum} — ${exName}`;restInterval=setInterval(()=>{restLeft--;document.getElementById('rest-time').textContent=fmtSec(restLeft);document.getElementById('rest-fill').style.width=(restLeft/restMax*100).toFixed(1)+'%';if(restLeft<=0){playBeep();skipRest()}},1000)}
function fmtSec(s){return Math.floor(s/60)+':'+(String(s%60).padStart(2,'0'))}
function addRest(s){restLeft+=s;restMax+=s;document.getElementById('rest-time').textContent=fmtSec(restLeft)}
function skipRest(){clearInterval(restInterval);restInterval=null;document.getElementById('rest-bar').classList.remove('on')}
function playBeep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.15,.3].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(0.3,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+.15);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.15)})}catch(e){}}
function startClock(startedAt){clearInterval(clockInterval);function tick(){const s=Math.floor((Date.now()-startedAt)/1000);document.getElementById('tclock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}tick();clockInterval=setInterval(tick,1000)}
function showCeleb(dayId){const d=DAYS.find(x=>x.id===dayId);document.getElementById('celeb').style.setProperty('--h',d.hue);document.getElementById('celeb-card').style.borderColor=d.hue;const msgs=['Crushed it!','Beast mode!',"That's a W!",'Get some!'];document.getElementById('celeb-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];document.getElementById('celeb-sub').textContent=`${d.name} done. Volume: ${fmtVol(calcVol(dayId))} ${getUnit()} lifted today.`;spawnParticles(d.hue);document.getElementById('celeb').classList.add('on')}
function closeCeleb(){document.getElementById('celeb').classList.remove('on')}
function spawnParticles(hue){const card=document.getElementById('celeb-card');for(let i=0;i<18;i++){const p=document.createElement('div');p.className='particle';p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;background:${hue};opacity:${Math.random()*.8+.2};width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'};animation:pfloat ${1+Math.random()*1.5}s ease forwards;`;card.appendChild(p);setTimeout(()=>p.remove(),2500)}}
function openM(id){if(id==='history')renderHistory();if(id==='settings')renderSettings();document.getElementById('modal-'+id).classList.add('on')}
function closeM(id){document.getElementById('modal-'+id).classList.remove('on')}
function renderHistory(){const body=document.getElementById('hist-body');const today=new Date();const calStart=new Date(today);calStart.setDate(calStart.getDate()-27);let cal='<div class="cal-grid">';['S','M','T','W','T','F','S'].forEach(h=>{cal+=`<div class="cal-hdr">${h}</div>`});for(let s=calStart.getDay();s>0;s--)cal+='<div></div>';for(let i=0;i<28;i++){const d=new Date(calStart);d.setDate(calStart.getDate()+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const isToday=k===todayK();const sess=ST.sess[k];const hasData=sess&&Object.values(sess.sets||{}).some(a=>a.some(Boolean));let dc='',dg='';if(hasData){const map={1:0,2:1,3:2,4:3,5:4};const idx=map[d.getDay()];if(idx!==undefined){dc=DAYS[idx].hue;dg=DAYS[idx].glow}}cal+=`<div class="cal-day${hasData?' has-data':''}${isToday?' today':''}" style="${dc?`--dc:${dc};--dg:${dg};`:''}">${d.getDate()}</div>`}cal+='</div>';const totalVol=Object.values(ST.sess).reduce((a,s)=>a+Object.entries(s.weights||{}).reduce((b,[k,w])=>b+((s.sets||{})[k]||[]).filter(Boolean).length*w*10,0),0);const daysLogged=Object.values(ST.sess).filter(s=>Object.values(s.sets||{}).some(a=>a.some(Boolean))).length;const prCount=DAYS.reduce((a,d)=>a+d.exercises.filter((_,i)=>getMaxW(d.id,i)>0).length,0);body.innerHTML=cal+`<div class="stats-grid"><div class="stat-card"><div class="stat-n">${getStreak()}</div><div class="stat-l">Day Streak</div></div><div class="stat-card"><div class="stat-n">${daysLogged}</div><div class="stat-l">Days Logged</div></div><div class="stat-card"><div class="stat-n">${fmtVol(totalVol)}</div><div class="stat-l">Total Volume</div></div><div class="stat-card"><div class="stat-n">${prCount}</div><div class="stat-l">PRs Set</div></div></div>`}
let resetTaps=0,resetTimeout;
function renderSettings(){const p=ST.prefs;document.getElementById('sett-body').innerHTML=`<div class="set-row"><div><div class="set-label">Weight Units</div><div class="set-sub">Display all weights in</div></div><div class="seg"><button class="seg-btn${p.units==='kg'?' on':''}" onclick="setPref('units','kg')">kg</button><button class="seg-btn${p.units==='lbs'?' on':''}" onclick="setPref('units','lbs')">lbs</button></div></div><div class="set-row"><div><div class="set-label">Compound Rest</div><div class="set-sub">After big multi-joint exercises</div></div><div class="seg"><button class="seg-btn${p.restC===60?' on':''}" onclick="setPref('restC',60)">60s</button><button class="seg-btn${p.restC===90?' on':''}" onclick="setPref('restC',90)">90s</button><button class="seg-btn${p.restC===120?' on':''}" onclick="setPref('restC',120)">2min</button></div></div><div class="set-row"><div><div class="set-label">Isolation Rest</div><div class="set-sub">After single-joint exercises</div></div><div class="seg"><button class="seg-btn${p.restI===45?' on':''}" onclick="setPref('restI',45)">45s</button><button class="seg-btn${p.restI===60?' on':''}" onclick="setPref('restI',60)">60s</button><button class="seg-btn${p.restI===90?' on':''}" onclick="setPref('restI',90)">90s</button></div></div><div class="set-row"><div><div class="set-label">Theme</div><div class="set-sub">Light or dark mode</div></div><div class="seg"><button class="seg-btn${!document.documentElement.dataset.theme?' on':''}" onclick="setTheme('')">Auto</button><button class="seg-btn${document.documentElement.dataset.theme==='light'?' on':''}" onclick="setTheme('light')">Light</button><button class="seg-btn${document.documentElement.dataset.theme==='dark'?' on':''}" onclick="setTheme('dark')">Dark</button></div></div><button class="rst-btn" id="rst-btn" onclick="doReset()">⚠️ Reset All Data</button>`}
function setPref(k,v){ST.prefs[k]=v;saveST();renderSettings();renderPanels();switchDay(activeDay)}
function setTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;renderSettings()}
function doReset(){resetTaps++;const btn=document.getElementById('rst-btn');if(resetTaps===1){btn.textContent='⚠️ Tap again to confirm — this cannot be undone';resetTimeout=setTimeout(()=>{resetTaps=0;btn.textContent='⚠️ Reset All Data'},3000)}else{clearTimeout(resetTimeout);resetTaps=0;ST.sess={};saveST();renderAll();closeM('settings')}}

loadST();
renderAll();
const sess=getToday();
if(sess.startedAt)startClock(sess.startedAt);
</script>
</body>
</html>
